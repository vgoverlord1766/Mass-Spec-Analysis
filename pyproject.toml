[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "massspec"
version = "0.1.0"
description = "Tools for processing and analyzing mass spectrometry data"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "adjustText",
]

[tool.setuptools.packages.find]
where = ["src"]